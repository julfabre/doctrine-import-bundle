name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality (static analysis + mutation)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: pcov
                  tools: composer:v2

            - uses: ramsey/composer-install@v3

            - name: Install isolated tools
              run: composer bin all install --no-progress

            - name: Static analysis
              run: composer qa:static

            - name: Tests with coverage
              run: composer test:coverage

            - name: Mutation testing
              run: composer test:mutation

    tests:
        name: Tests (PHP ${{ matrix.php }}, ${{ matrix.label }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Oldest supported stack: SF 6.4, DBAL 3.8, ORM 2.17.
                    - { label: lowest, php: '8.2', symfony: '6.4.*', dependencies: lowest }
                    # Legacy applications already on DBAL 4 / ORM 3.
                    - { label: legacy, php: '8.2', symfony: '6.4.*', dependencies: highest, extra: 'doctrine/dbal:^4.0 doctrine/orm:^3.0' }
                    - { label: lts, php: '8.3', symfony: '7.4.*', dependencies: highest }
                    - { label: latest, php: '8.4', symfony: '8.*', dependencies: highest }
                    - { label: next, php: '8.5', symfony: '', dependencies: highest }
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2, flex

            - name: Pin extra dependencies
              if: ${{ matrix.extra }}
              run: composer require --dev --no-update ${{ matrix.extra }}

            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - name: Run tests
              run: composer test

deptrac:
    cache_file: var/cache/.deptrac.cache
    paths:
        - ./src
    exclude_files:
        - '#.*Test\.php$#'
    layers:
        - name: Diagnostic
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Diagnostic\\.*' }
        - name: Exception
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Exception\\.*' }
        - name: Schema
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Schema\\[^\\]+$' }
        - name: SchemaDbal
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Schema\\Dbal\\.*' }
        - name: Analysis
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Analysis\\.*' }
        - name: Definition
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Definition\\.*' }
        - name: Rendering
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Rendering\\.*' }
        - name: Writer
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Writer\\.*' }
        - name: Application
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Application\\.*' }
        - name: Bundle
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\JufDoctrineImportBundle$' }
        - name: Command
          collectors:
              - { type: classLike, value: '^Juf\\DoctrineImportBundle\\Command\\.*' }
        - name: Dbal
          collectors:
              - { type: classLike, value: '^Doctrine\\DBAL\\.*' }
        - name: Orm
          collectors:
              - { type: classLike, value: '^Doctrine\\(ORM|Persistence|Bundle)\\.*' }
        - name: Symfony
          collectors:
              - { type: classLike, value: '^Symfony\\.*' }
        - name: Inflector
          collectors:
              - { type: classLike, value: '^Doctrine\\Inflector\\.*' }
        - name: PhpGenerator
          collectors:
              - { type: classLike, value: '^Nette\\PhpGenerator\\.*' }
    ruleset:
        Diagnostic: ~
        Exception: ~
        Definition: [Diagnostic]
        Schema: [Diagnostic]
        SchemaDbal: [Schema, Diagnostic, Exception, Dbal]
        Analysis: [Schema, Definition, Diagnostic, Exception, Inflector]
        Rendering: [Definition, PhpGenerator, Inflector]
        Writer: [Rendering, Exception]
        Application: [Schema, SchemaDbal, Analysis, Definition, Rendering, Writer, Diagnostic, Exception]
        Command: [Application, Schema, SchemaDbal, Rendering, Writer, Diagnostic, Exception, Symfony, Orm, Dbal]
        Bundle: [Command, Symfony]
